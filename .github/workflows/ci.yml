name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest] # windows-latest disabled due to missing prebuilt LLVM dev libs from choco
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v3

    - name: Install LLVM (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-14-dev

    - name: Install LLVM (macOS)
      if: runner.os == 'macOS'
      run: brew install llvm@14

    - name: Install LLVM (Windows)
      if: runner.os == 'Windows'
      run: choco install llvm --version=14.0.0 --allow-downgrade --force

    - name: Configure CMake
      shell: bash
      run: |
        LLVM_CMAKE_DIR=""
        if [ "$RUNNER_OS" == "macOS" ]; then
          LLVM_CMAKE_DIR="$(brew --prefix llvm@14)/lib/cmake/llvm"
        elif [ "$RUNNER_OS" == "Windows" ]; then
          LLVM_CMAKE_DIR="C:/Program Files/LLVM/lib/cmake/llvm"
        fi
        
        if [ -n "$LLVM_CMAKE_DIR" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLLVM_DIR="$LLVM_CMAKE_DIR"
        else
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        fi

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      run: cd build && ctest -C ${{ matrix.build_type }} --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install clang-format
      run: sudo apt-get install -y clang-format

    - name: Check formatting
      run: find compiler runtime std cli -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Run security checks
      run: |
        # Add security scanning tools here
        echo "Security checks passed"
